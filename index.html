<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a0b3d">
<title>Fairy Maze</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#140834;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:3vh 4vw;text-align:center;overflow-y:auto;touch-action:pan-y}
.screen.on{display:flex}
h1{font-size:clamp(40px,9vw,96px);margin:0;color:#ffd6f3;text-shadow:0 0 18px #ff7ad9,0 4px 0 #8a2b8f;letter-spacing:2px}
h2{font-size:clamp(34px,7vw,72px);margin:0;color:#fff2a8;text-shadow:0 0 14px #ffb84d,0 4px 0 #a0522d}
.big{font-size:clamp(22px,4.5vw,40px)}
button{font:inherit;font-weight:bold;border:none;border-radius:999px;cursor:pointer;color:#fff;padding:.5em 1.4em;font-size:clamp(24px,5vw,42px);min-height:72px;min-width:72px;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .1s}
button:active{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.play{background:linear-gradient(#ff7ad9,#d63fb0)}
.alt{background:linear-gradient(#7ab8ff,#4a6fe0)}
.rec{background:linear-gradient(#ffb04d,#e66a1f);font-size:clamp(18px,3.6vw,30px)}
.rec.recording{background:linear-gradient(#ff5050,#c41e1e);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
input#name{font:inherit;font-size:clamp(28px,6vw,48px);text-align:center;border-radius:24px;border:5px solid #ffb8ea;padding:.2em .5em;width:min(90vw,520px);color:#7a1f6a;background:#fff8fd;user-select:text;-webkit-user-select:text}
.sw{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.sw div{width:clamp(56px,11vw,84px);height:clamp(56px,11vw,84px);border-radius:50%;border:6px solid rgba(255,255,255,.35);cursor:pointer}
.sw div.sel{border-color:#fff;box-shadow:0 0 0 5px #ffe066,0 0 22px #fff}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center}
#preview{width:150px;height:150px;position:static}
#hud{position:fixed;top:0;left:0;right:0;display:none;justify-content:space-between;align-items:center;padding:max(8px,env(safe-area-inset-top)) 12px 8px;pointer-events:none}
#hud.on{display:flex}
#hud .pill{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 18px;font-size:clamp(20px,4vw,34px);font-weight:bold}
#hud button{pointer-events:auto;font-size:28px;min-height:60px;min-width:60px;padding:0 .6em;background:rgba(255,255,255,.25)}
.mazes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;width:min(94vw,900px)}
.mz{background:rgba(255,255,255,.12);border-radius:22px;padding:12px;cursor:pointer;font-size:22px;font-weight:bold}
.mz canvas{position:static;width:100%;height:auto;border-radius:12px;background:#1d0f4a}
small{opacity:.75;font-size:clamp(14px,2.6vw,20px)}
</style>
</head><body>
<canvas id="c"></canvas>
<div id="hud"><button id="homeBtn" aria-label="Home">🏠</button><div class="pill" id="lvl">Level 1</div><div class="pill" id="stars">⭐ 0</div></div>

<div class="screen on" id="start">
  <h1>Fairy Maze</h1>
  <canvas id="preview" width="300" height="300"></canvas>
  <input id="name" maxlength="14" aria-label="Fairy name" autocomplete="off">
  <div class="sw" id="swatches"></div>
  <div class="row">
    <button class="play" id="playBtn">▶ Play</button>
    <button class="alt" id="mazesBtn">🗺️ Our Mazes</button>
  </div>
  <div class="row"><button class="rec" id="recBtn">🎤 Record your NOM NOM!</button><button class="rec" id="recPlay" style="display:none">🔊</button><button class="rec" id="recDel" style="display:none">✖</button></div>
</div>

<div class="screen" id="mazes"><h2>Our Mazes</h2><div class="mazes" id="mazeList"></div><button class="alt" id="mazesBack">⬅ Back</button></div>

<div class="screen" id="yummy"><h2 style="font-size:clamp(56px,13vw,130px)">Yummy!</h2><div class="big" id="yumStars"></div><button class="play" id="nextBtn">Next ▶</button></div>

<div class="screen" id="done"><h1 id="doneTitle">You did it!</h1><div class="big" id="doneStars"></div><canvas id="donePrev" width="300" height="300" style="position:static;width:170px;height:170px"></canvas><button class="play" id="againBtn">🏠 Play again</button></div>

<script src="levels/builtin.js"></script>
<script src="levels/custom.js"></script>
<script src="game.js"></script>
</body></html>
