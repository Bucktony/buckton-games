<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buckton Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:radial-gradient(circle at 30% 20%,#3b1d7a,#160a35);font-family:"Trebuchet MS","Comic Sans MS",sans-serif;color:#fff}
h1{font-size:clamp(40px,8vw,84px);margin:0;text-shadow:0 0 18px #ff7ad9,0 4px 0 #8a2b8f}
.tiles{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;padding:0 16px}
a.tile{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(80vw,280px);padding:26px 18px;border-radius:36px;text-decoration:none;color:#fff;font-size:clamp(26px,4vw,36px);font-weight:bold;box-shadow:0 8px 0 rgba(0,0,0,.3);transition:transform .12s}
a.tile:hover{transform:scale(1.05)}a.tile .e{font-size:110px;line-height:1}
.fairy{background:linear-gradient(#ff7ad9,#b83fd6)}.trucks{background:linear-gradient(#ff5a4e,#c81e1e)}
.soon{opacity:.6;pointer-events:none}.soon small{font-size:22px;background:rgba(0,0,0,.25);border-radius:999px;padding:4px 14px}
</style></head><body>
<h1>Buckton Games</h1>
<div class="tiles">
 <a class="tile fairy" href="fairy-maze/"><span class="e">🧚</span>Fairy Maze</a>
 <a class="tile trucks soon" id="trucks" href="https://bucktony.github.io/trucks/"><span class="e">🚚</span>Big Trucks<small>coming soon</small></a>
</div>
<script>// Trucks is its own site (Bucktony/trucks); same origin, so we can check it: "coming soon" until it answers 200
fetch('https://bucktony.github.io/trucks/',{method:'HEAD',cache:'no-store'}).then(r=>{if(r.ok){const t=document.getElementById('trucks');t.classList.remove('soon');const s=t.querySelector('small');if(s)s.remove()}}).catch(()=>{});</script>
</body></html>
